<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Produtos - CRUD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
    h1, h2 { color: #333; }
    form { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    div.input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #218838; }
    button.cancel { background-color: #6c757d; display: none; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #007bff; color: white; }
    .btn-edit { background-color: #ffc107; color: #212529; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    #loading { font-weight: bold; color: #007bff; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>

  <h1>Gerenciamento de Produtos</h1>

  <form id="productForm">
    <h2 id="formTitle">Novo Produto</h2>
    <input type="hidden" id="productId">
    
    <div class="input-group">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required>
    </div>

    <div class="input-group">
      <label for="preco">Preço (R$):</label>
      <input type="number" step="0.01" id="preco" required>
    </div>

    <div class="input-group">
      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" required>
    </div>

    <button type="submit" id="btnSave">Salvar</button>
    <button type="button" id="btnCancel" class="cancel" onclick="resetForm()">Cancelar</button>
  </form>

  <div id="loading">Carregando dados...</div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Quantidade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="productTableBody">
      <!-- Linhas inseridas via JS -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
